<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Login - Book Management</title><link rel="stylesheet" href="css/login.css"></head>
<body><div class="login-card"><div class="brand">BOOK MANAGEMENT</div><h1>Welcome Back</h1><p>Sign in to continue to your dashboard</p><form id="loginForm"><label>Username<div class="input-wrap"><span>◉</span><input id="username" autocomplete="username" required></div></label><label>Password<div class="input-wrap"><span>◆</span><input id="password" type="password" autocomplete="current-password" required><button type="button" id="togglePassword" class="icon-btn">◉</button></div></label><div id="loginError" class="error"></div><button type="submit">Sign In</button></form><button type="button" id="forgotBtn" class="forgot-btn">Forgot username or password?</button></div><div id="forgotModal" class="modal"><div class="modal-card"><button id="closeForgot" class="close-btn">×</button><h2>Account Recovery</h2><p>Your saved login username is:</p><strong id="recoveryUsername"></strong><p class="recovery-note">For security, use Settings after login to change your password.</p><button id="recoveryOk">Close</button></div></div><script src="js/login.js"></script></body></html>
