<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Book Received</title>
    <link rel="stylesheet" href="../css/global.css">
    <style>
        .received-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .received-table th, .received-table td { padding: 10px 8px; border: 1px solid #e5e7eb; text-align: left; font-size: 13px; }
        .received-table th { background-color: #f9fafb; font-weight: 600; color: #111827; }
        .received-table tr:nth-child(even) { background-color: #f9fafb; }
        .receive-input { width: 65px; padding: 6px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; font-weight: bold; }
        
        .action-cell { display: flex; gap: 5px; align-items: center; }
        .btn-sm { width: 30px; height: 30px; font-size: 14px; cursor: pointer; border: none; border-radius: 4px; color: white; display: flex; justify-content: center; align-items: center; }
        .edit-btn { background-color: #f59e0b; }
        .delete-btn { background-color: #ef4444; }
    </style>
</head>
<body>
    <div class="main-content">
        <h2 class="page-title">Receive Pending Books</h2>

        <div class="form-card" style="margin-bottom: 20px;">
            <div class="form-grid" style="align-items: end;">
                <div class="form-group">
                    <label>Select Publisher</label>
                    <select id="publisherSelect" style="padding: 10px; width: 300px;">
                        <!-- JS options load korbe -->
                    </select>
                </div>
            </div>
        </div>

        <div class="form-card" id="pendingSection" style="display: none; margin-bottom: 20px;">
            <div class="section-title">Ordered Books & Receiving Status</div>
            <table class="received-table">
                <thead>
                    <tr>
                        <th>Sl</th><th>Book Name</th><th>Writer</th><th>Part</th>
                        <th>Ordered (Pcs)</th><th>Received (Pcs)</th><th>Pending (Pcs)</th>
                        <th>Rec. Qty (Pcs)</th><th>Rate</th><th>Amount</th><th>Dis %</th><th>G. Total</th><th>Action</th>
                    </tr>
                </thead>
                <tbody id="pendingTableBody"></tbody>
            </table>
        </div>
    </div>
    
    <script src="../js/global.js"></script>
    <script src="../js/bookreceived.js?v=20260920-2"></script>
</body>
</html>
