<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Class Book Setup</title>
    <link rel="stylesheet" href="../css/global.css">
    <style>
        .class-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .class-table th, .class-table td { padding: 10px; border: 1px solid #e5e7eb; text-align: left; font-size: 14px; }
        .class-table th { background-color: #f3f4f6; font-weight: bold; }
        .class-table tr:nth-child(even) { background-color: #f9fafb; }
        .book-check { width: 18px; height: 18px; cursor: pointer; }
        .highlight-row { background-color: #ecfdf5 !important; border-left: 4px solid #059669; }
    </style>
</head>
<body>
    <div class="main-content">
        <h2 class="page-title">Class Wise Book List Setup</h2>

        <div class="form-card" style="margin-bottom: 20px;">
            <div class="form-grid" style="align-items: end;">
                <div class="form-group">
                    <label>Select Class</label>
                    <select id="classSelect" style="padding: 10px; width: 250px;">
                        <option value="">-- Choose Class --</option>
                    </select>
                </div>
                <div class="form-group" style="display: flex; gap: 10px;">
                    <button type="button" id="addClassBtn" class="btn-primary">➕ Add New Class</button>
                    <button type="button" id="editClassBtn" class="btn-submit" style="background:#f59e0b;">✎ Edit Class</button>
                    <button type="button" id="deleteClassBtn" class="btn-reset" style="background:#ef4444;color:white;">🗑 Delete Class</button>
                </div>
            </div>
        </div>

        <div class="form-card" id="bookListSection" style="display: none;">
            <div class="section-title">Assign Books for <span id="displayClassName" style="color:#2563eb;"></span></div>
            <p style="color: #6b7280; font-size: 13px; margin-bottom: 15px;">Check the boxes for the books you want to assign to this class.</p>
            
            <table class="class-table">
                <thead>
                    <tr>
                        <th style="width: 50px; text-align: center;">Select</th>
                        <th>Book Name</th>
                        <th>Writer</th>
                        <th>Part</th>
                        <th>Publisher</th>
                        <th>Price (₹)</th>
                    </tr>
                </thead>
                <tbody id="bookListBody"></tbody>
            </table>

            <div style="margin-top: 20px; text-align: right;">
                <button id="saveClassBooksBtn" class="btn-submit" style="padding: 10px 25px; font-size: 16px;">💾 Save Class Books</button>
            </div>
        </div>
    </div>
    
    <script src="../js/global.js"></script>
    <script src="../js/class_book_setup.js"></script>
</body>
</html>
