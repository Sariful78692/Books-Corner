<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Class Wise Book Sales</title>
    <link rel="stylesheet" href="../css/global.css">
    <style>
        .sales-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        .sales-table th, .sales-table td { padding: 8px 10px; border: 1px solid #e5e7eb; text-align: left; font-size: 13px; }
        .sales-table th { background-color: #f3f4f6; font-weight: bold; }
        .sales-table tr:nth-child(even) { background-color: #f9fafb; }
        .s-input { width: 70px; padding: 5px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; font-weight: bold; }
        .totals-box { background-color: #ecfdf5; padding: 15px; border-radius: 6px; border: 1px solid #10b981; margin-top: 20px; display: flex; justify-content: space-between; align-items: flex-end; }
        .book-check { width: 18px; height: 18px; cursor: pointer; }
        .out-of-stock { background-color: #fee2e2 !important; color: #ef4444; }
    </style>
</head>
<body>
    <div class="main-content">
        <h2 class="page-title">Class Wise Book Sales & Billing</h2>

        <div class="form-card" style="margin-bottom: 20px;">
            <div class="form-grid" style="align-items: end;">
                <div class="form-group"><label>Student Name <span>*</span></label><input type="text" id="customerName" required style="padding: 9px;"></div>
                <div class="form-group"><label>Mobile No</label><input type="text" id="customerMobile" style="padding: 9px;"></div>
                <div class="form-group"><label>Address</label><input type="text" id="customerAddress" style="padding: 9px;"></div>
                <div class="form-group">
                    <label>Select Class <span>*</span></label>
                    <select id="classSelect" style="padding: 10px; width: 100%;"><option value="">-- Choose Class --</option></select>
                </div>
                <div class="form-group"><label>Date</label><input type="date" id="salesDate" style="padding: 9px;" readonly></div>
            </div>
        </div>

        <div class="form-card" id="salesListSection" style="display: none;">
            <div class="section-title">Invoice Items for <span id="displayClassName" style="color:#2563eb;"></span></div>
            
            <table class="sales-table">
                <thead>
                    <tr>
                        <th style="width: 40px; text-align: center;">Sell</th>
                        <th style="width: 80px; text-align: center;">Already Sold</th>
                        <th>Book Name</th><th>Publisher</th><th>Writer</th><th>Part</th>
                        <th style="background-color: #fef3c7;">Stock</th> <!-- ⚠️ নতুন কলাম -->
                        <th>Rate (₹)</th><th>Qty</th><th>Amount</th><th>Dis %</th><th>Grand Total</th>
                    </tr>
                </thead>
                <tbody id="salesListBody"></tbody>
            </table>

            <div class="totals-box">
                <div>
                    <div style="font-size: 15px; color: #374151; margin-bottom: 5px;">Total Books Selected:</div>
                    <div id="totQty" style="color:#2563eb; font-weight:bold; font-size: 24px;">0</div>
                </div>
                <div style="text-align: right; line-height: 1.8; font-size: 15px;">
                    <div>Sub Total: <strong id="totAmount">₹0.00</strong></div>
                    <div>Item Discount: <strong id="totDiscount" style="color:#ef4444;">₹0.00</strong></div>
                    
                    <div style="display: flex; align-items: center; justify-content: flex-end; gap: 8px; margin-top: 5px;">
                        Add. Discount: 
                        <input type="number" id="overallDiscountPct" placeholder="%" min="0" step="0.01" style="width: 60px; padding: 4px; font-weight: bold; text-align: center;"> %
                        <span style="font-weight: bold; font-size: 12px; margin: 0 5px;">OR</span> - ₹
                        <input type="number" id="overallDiscount" value="0" min="0" step="1" style="width: 80px; padding: 4px; font-weight: bold; text-align: right;">
                    </div>
                    
                    <div style="font-size: 18px; font-weight: bold; margin-top: 10px; border-top: 1px solid #10b981; padding-top: 10px;">
                        Net Payable: <span id="totGrand" style="color:#059669;">₹0.00</span>
                    </div>
                    
                    <div style="display: flex; align-items: center; justify-content: flex-end; gap: 10px; margin-top: 10px; background: #fff; padding: 10px; border-radius: 5px; border: 1px solid #d1d5db;">
                        <span style="color: #374151; font-weight:bold;">Paid Amount: ₹</span>
                        <input type="number" id="paidAmount" min="0" step="1" style="width: 100px; padding: 6px; font-size: 16px; font-weight: bold; text-align: right; border: 2px solid #3b82f6; color:#2563eb;">
                    </div>
                    <div style="font-size: 18px; font-weight: bold; margin-top: 5px; color: #ef4444;">
                        Due Amount: <span id="dueAmount">₹0.00</span>
                    </div>
                </div>
            </div>

            <div style="margin-top: 20px; text-align: right;">
                <button type="button" id="submitSalesBtn" class="btn-submit" style="padding: 12px 30px; font-size: 16px; background-color: #3b82f6;">
                    🖨️ Submit Sale & Print Bill
                </button>
            </div>
        </div>
    </div>
    
    <script src="../js/global.js"></script>
    <script src="../js/booksales.js"></script>
</body>
</html>
