<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Publisher Book List</title>
    <link rel="stylesheet" href="../css/global.css">
    <style>
        .order-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .order-table th, .order-table td { padding: 10px 12px; border: 1px solid #e5e7eb; text-align: left; font-size: 14px; }
        .order-table th { background-color: #f9fafb; font-weight: 600; color: #111827; }
        .order-table tr:nth-child(even) { background-color: #f9fafb; }
        .action-cell { display: flex; justify-content: center; gap: 8px; }
        .btn-sm { width: 30px; height: 30px; font-size: 14px; cursor: pointer; border: none; border-radius: 4px; color: white; }
        .edit-btn { background-color: #f59e0b; }
        .delete-btn { background-color: #ef4444; }
    </style>
</head>
<body>
    <div class="main-content">
        <h2 class="page-title" id="pageTitle">Publisher Books</h2>

        <div id="listView" class="form-card">
            <div class="section-title" id="sectionTitle">All Books List</div>
            <table class="order-table">
                <thead>
                    <tr>
                        <th style="width: 5%;">Sl</th>
                        <th style="width: 15%;">Date</th>
                        <th style="width: 20%;">Publisher Name</th>
                        <th style="width: 20%;">Book Name</th>
                        <th style="width: 20%;">Writer Name</th>
                        <th style="width: 10%;">Part</th>
                        <th style="width: 10%; text-align: center;">Action</th>
                    </tr>
                </thead>
                <tbody id="publisherTableBody"></tbody>
            </table>
        </div>

        <!-- এডিট পেজ -->
        <div id="editView" class="form-card" style="display: none;">
            <div class="section-title">Edit Book Details</div>
            <form id="editBookForm">
                <input type="hidden" id="editIndex"><input type="hidden" id="oldDate">
                <input type="hidden" id="oldPublisher"><input type="hidden" id="oldBookName">
                <input type="hidden" id="oldWriter"><input type="hidden" id="oldPart">

                <div class="form-grid">
                    <div class="form-group"><label>Date <span>*</span></label><input type="date" id="editDate" required></div>
                    <div class="form-group"><label>Publisher Name <span>*</span></label><select id="editPublisher" required></select></div>
                    <div class="form-group"><label>Book Name <span>*</span></label><input type="text" id="editBookName" required></div>
                    <div class="form-group"><label>Writer Name</label><input type="text" id="editWriter"></div>
                    <div class="form-group"><label>Part</label><input type="text" id="editPart"></div>
                </div>
                
                <div class="form-actions" style="margin-top: 20px;">
                    <button type="submit" class="btn-submit">Update Book</button>
                    <button type="button" class="btn-reset" id="cancelEditBtn">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../js/global.js"></script>
    <script src="../js/publisher.js"></script>
</body>
</html>
